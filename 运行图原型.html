function renderNote(){
  const m=DATA.meta||{};
  document.getElementById("note").innerHTML=`
    <b>数据来源与口径</b><br>
    · <b>数据来源</b>：由 <code>mcp-server-12306</code>（drfccv，MIT）聚合 12306 官方接口；若该服务不可用会自动回退到内置直连，刷新结果里会标明实际用的是哪套。<br>
    · <b>经停站</b>：来自 12306 <code>czxx/queryByTrainNo</code> 接口，全部为<b>实测真实经停</b>；<b>画图用的车站轴</b>已统一到城市级，依据是 12306 官方车站表 <code>station_name.js</code> 里自带的「城市」字段（3388 站全覆盖）—— 站名以城市名开头者并入该市（郑州东→郑州、南京南→南京、杭州东→杭州），站名以同城另一个站名开头者并入那个站（兰考南→兰考、民权北→民权），以 东/南/西/北 结尾的高铁站并入基名（永城北→永城、黟县东→黟县），本路线起终点所在城市的车站一律并到起终点行（武进/戚墅堰/金坛→常州）。<br>
    · <b>起终站列</b>：表格中原样列出该趟车<b>本次查询区段</b>的实测出发 / 到达站（如 <code>郑州东→常州北</code>），不做归并 —— 同名车次的多趟（如 G1950 在郑州、郑州东各有一趟）就靠这一列区分。端点是按「查询时点名的那个站」在实测经停里定位的，所以换区间后不会串成上一次的起终站。<br>
    · <b>票价</b>：来自 12306 <code>leftTicketPrice</code> 接口，抓取于 <b>${m.price_captured||"—"}</b>。<br>
    · <b>余票</b>：来自 <code>leftTicket/query</code> 接口，快照时间 <b>${m.live_captured||"—"}</b>；标注「余票未知」表示该接口未覆盖该席别。<br>
    · <b>纵轴</b>：每个通道的车站由<b>该通道每趟车的实测经停各自推导</b>（拓扑排序），所以三条通道的站点集合各不相同；按经由顺序等距排布，不严格对应实际里程。路由条上的「车站」可切换：<b>全部站</b>／<b>主要站</b>（停靠该站的车次 > 本通道车次的 <b>30%</b>，且<b>总数 ≤ 12</b>）／<b>枢纽站</b>（> <b>70%</b>，且<b>总数 ≤ 7</b>）。两种档位都**包含起终点站**（首末站任何情况下都保留）；超出上限时按停靠车次从多到少保留。<br>
    · <b>通道划分</b>：把每趟车的<b>中间城市集合</b>两两算相似度（Jaccard ≥ 0.45）后聚类，自动分出若干条走廊 —— 郑州→常州 会分出京沪 / 合杭 / 连镇三条，上海→杭州 分出嘉兴 / 湖州两条，<b>不依赖任何写死的线路名</b>，换任何区间都成立。通道名默认取该通道<b>最具辨识度的中间站</b>（如「嘉兴通道」），改 <code>data/channel_aliases.json</code> 里的 <code>names</code> 即可换成你习惯的叫法（郑州→常州 已预置为京沪 / 合杭 / 连镇）。通道说明（「经 …」，仍由数据生成）只在数据集里保留，界面上不再显示。<br>
    · <b>自定义始发 / 终到站</b>：顶部填入「出发 / 到达」后点<b>换线路</b>，即按新区间重新抓取（新线路第一次约 <b>10–40 秒</b>，已有缓存的区间几秒）。站名支持输入任意<b>城市或车站</b>（郑州东会按郑州处理），输入框有 3388 个站名的下拉补全，打错的站会当场标红、不会白跑一趟。查票一律<b>按城市</b>发请求，所以郑州 / 郑州东 / 郑州航空港的车次都会返回。同一区间的数据各自缓存，切回去不必重抓。<br>
    · <b>经停抓取并发（高级设置）</b>：<b>页面底部</b>（这段数据说明的上方）的「<b>高级设置</b>」里可选<b>串行 / 3 并行 / 6 并行</b>（默认 6，记在浏览器本地）。整车次的经停是一趟一个请求（直连 12306，不走 MCP，省掉了「车次号→内部编号」那次多余请求），所以并发就是速度：6 路并发实测 <b>393 趟首次抓取约 20 秒</b>，串行则要 20 分钟量级。被限流时会立刻停下并保留已有进度，下次刷新接着补。<br>
    · <b>发车时间 / 票价筛选</b>：侧栏两组双滑块 —— 拖两端把手缩放、点轨道空白把最近的一端挪过来、「重置」清除。发车时间按该趟车的发车时刻算；票价的<b>档位就是本次查询里出现过的每一个真实票价</b>（去重升序，不是固定 5 元一档），但它们在轨道上是<b>等距铺开</b>的 —— 第 i 档固定落在 i/(n-1) 处，而不是按价格比例画：票价分布很不均匀（几十元那一段挤了大半趟车、尾部只有少数高价），按真实比例画会让滑块左端几十档挤成一坨、右端一大片空，既看不清也拖不准。<b>这样每档在轨道上走过的距离一样长，落点又始终是一个真实存在的票价</b>。上下限仍是真实的最低价 / 最高价，轨道上的刻度与档位一一对应（鼠标悬停数值处可看档数与价格范围）；两端可以收到<b>同一档</b>。票价只要<b>所选席别中有任意一个</b>落在区间内就算通过（用最低价判断会把「硬座便宜但已售罄」的车错杀）。档位与上下限随所选席别 / 通道自动重算。<br>
    · <b>始发站 / 终到站筛选</b>：侧栏席别下面两行按钮，只列<b>本次查询里真实出现过的实测起终站</b>（如 常州 159 趟 / 常州北 78 趟 / 金坛 12 趟），<b>可多选</b>，点「全部」一键全选或全不选，按钮上的小数字是该站趟数（悬停可看「该站趟数 / 总趟数」）。筛选结果同时作用于运行图、明细表与趟数统计。直达模式筛的就是每趟车本次区间的实测起终站；<b>中转模式只筛线路两端</b> —— 始发站取第 1 程的出发站、终到站取第 2 程的到达站（第 1 程的「终到」是几十个中转站，筛它没有意义）。换线路 / 进出中转后会自动回到「不限」。<br>
    · <b>同城多站</b>：郑州 / 郑州东 / 郑州航空港 这类同一城市的不同车站，在纵轴上占<b>同一行</b>、按时刻<b>左右分开</b>画出各自的停靠点 —— 所以一趟车在同一城市停两次会看到两个点（如 G1950 的「郑州 17:48」与「郑州东 18:10」）。鼠标悬停站名可看该行包含哪些车站。<br>
    · <b>中转查询</b>：点左侧<b>站名</b>会选中该站（站名变橙色），再点「<b>刷新数据</b>」并确认后，即<b>实时抓取</b>「郑州→该站」与「该站→常州」两程的全部车次，就地画在图上且原有线路隐藏；再点同一站名，或点路由条右侧的「退出中转」，即可恢复（也可用<b>车型栏的第1程 / 第2程</b>分别筛选两程车型）。数据时间与退出按钮显示在<b>路由条右侧</b>。车次明细表会按<b>第 1 程 / 第 2 程分成两段</b>，各带一条小标题（含该程共多少趟、当前显示多少趟），排序在每段内各自进行。<br>
    · <b>中转站有多个车站时</b>（如徐州 / 徐州东、常州 / 常州北 / 金坛）：同一趟车可能「到这个站、却要从另一个站出发」，所以中转行会按<b>实际车站</b>用<b>不同的点</b>区分，共 <b>6 种</b> —— ● 实心圆 · ○ 空心圆 · ■ 实心方块 · □ 空心方块 · ▲ 实心三角 · △ 空心三角，行内右上角有对应图例；超过 6 个站时图例会点明总站数。选中该车时，各站时刻也会带上站名（如「徐州东 05:47」）。该行只涉及一个车站时，全部用默认的实心圆。<br>
    · <b>中转的经停站</b>：中转查询本身只取票价 + 余票（所以快），中间经停是<b>按需增量补</b>的 —— 进入中转后会自动补一批（36 趟，当前可见的车次），路由条右侧的「<b>补全经停 n</b>」按钮可再补一批；补好的会存进服务端共享的经停缓存，同一个枢纽第二次进来几乎瞬时。补全和直达走同一套直连查询，并发数也共用「高级设置」里的那一档。尚未补到的车次按起终两点直线绘制，路由条上会写明还有多少趟。<br>
    · <b>中转的席别是两程分开选的</b>（与车型一样分两行），第 1 程选什么不影响第 2 程；线条颜色、是否算「有票」都按该程自己的席别判定，顶部图例也分「第1程 / 第2程」两段显示。<br>
    · <b>进入中转会自动勾选「仅看有票」</b>（退出时还原成原来的状态），路由条上显示「仅看有票：显示 N / M 趟」。两程只取票价与余票、<b>不抓经停</b>，所以每程是从起点到终点的直线，穿过中间城市并不代表停靠；中转站所在行用橙色虚线标出 <b>⟳ 中转站</b>。<br>
    · <b>刷新数据的含义</b>：按钮永远是「要最新的」—— 直达模式下重新抓取全程车次，中转模式下<b>绕过缓存 </b>重新抓取两程（约 5–10 秒）。所以同一站反复点刷新也会重新取数。<br>
    · <b>时间轴缩放</b>：把鼠标移到运行图下方的<b>时间轴</b>上滚动滚轮即可放大 / 缩小（以指针所指时刻为锚点；指针在可视窗之外时以窗口中心为锚点）；也可以直接<b>拖动时间轴</b> —— 拖中间平移、拖两端把手缩放、点「重置」或<b>双击时间轴</b>回到全时段。运行图本身不响应滚轮。最细可缩到半小时跨度，刻度间隔随缩放自动切换（4h → 2h → 1h → 30min → 15min）。切换通道、进出中转、刷新数据都会自动重置缩放。<br>
    · <b>搜索车次</b>：支持完整车次（<code>G1988</code>）、纯数字（<code>1988</code>）、前缀（<code>K5</code>），即时筛选运行图与明细表；当前通道只命中一趟时自动选中并标出各站时刻；按 <code>Enter</code> 可直接定位。若当前通道无命中，会提示其余通道的命中数并可一键切过去。<br>
    · <b>车型筛选</b>：<b>可多选</b>，按钮只列当前范围内真实出现过的车型，点「全部」一键全选。线型只分三类：<b>高铁 G</b> 实线、<b>动车 D / 城际 C</b> 虚线、<b>普速 Z / T / K / 纯数字</b> 点线。<br>
    · <b>中转模式下按程筛选车型</b>：车型栏会变成「<b>第1程</b>」「<b>第2程</b>」两行，各自独立多选，筛其中一程不影响另一程；行尾的 <code>n/m 趟</code> 显示该程当前可见 / 总趟数。进入中转时会<b>继承</b>进入前的车型选择（若进入前是「全部」，两程也取全部）。<br>
    · <b>勾选车次</b>：点击车次明细表最左侧的勾选框（或点整行、或直接点运行图上的线路）即可勾选，<b>支持多选</b>；被勾选的线路会加粗高亮并在各站旁标出到发时刻，其余线路淡出。表格标题会显示已勾选数量。<br>
    · <b>标签策略</b>：只要有车次被勾选，就隐藏全部车次名标签，避免与各站时刻文字重叠。<br>
    · <b>席别筛选</b>：默认勾选<b>二等座 + 硬卧 + 硬座</b>，可点「默认」一键恢复，或用「全选 / 清空」。<b>线条颜色</b>取<b>所选席别中等级最低且当前有票的那个</b> —— 所以「只有商务座有票」的车次会显示商务座的颜色，而不会让人误以为整趟车都能买；「有票 / 无票」判定与统计数字同样只按勾选的席别计算。淡显的席别表示未勾选，不参与判定。<br>
    · <b>起价</b>：= 所选席别中<b>当前有票</b>的最低票价；全部都无票时显示 <code>--</code>（悬停可看该车所选席别的最低价）。点表头的「起价」即按此价升序排列，无票的排最后，再点一下恢复按发车时间。<br>
    · <b>高亮有票</b>：等同于把这些有票车次在表格里<b>全部勾选</b> —— 加粗、沿线标出各站时刻、其余淡出（不过滤掉）。若已手动勾选了车次，则以手动勾选为准。<br>
    · <b>乘车日期</b>：改动顶部的日期会按新日期重新抓取（12306 预售期内）；表头最左的勾选框可对<b>当前列表</b>全选 / 全不选。<br>
    · 折线在经过但未停靠的城市处直接穿过，符合列车运行图惯例。<br>
    · 本原型仅供个人学习研究，实时购票请以 12306 官方为准。<br>
    <span style="color:#b4b2a9">注：12306 余票接口对高频请求有长时间限流。点击「刷新数据」会通过本地服务重新抓取；若被限流会自动沿用上次快照并提示。</span>`;
}

async function boot(){
  if(CAN_API){
    try{
      const d=await (await fetch("/api/data")).json();
      if(d&&d.trains&&d.trains.length){DATA.meta=d.meta;DATA.axes=d.axes;DATA.freq=d.freq||{};DATA.rowst=d.rowst||{};DATA.trains=d.trains;}
      setMsg("已连接本地服务");
    }catch(e){
      setMsg("本地服务未响应，使用页面内置数据","warn");
    }
    fetch("/api/status").then(r=>r.json()).then(j=>{
      if(j.running) pollStatus();
    }).catch(()=>{});
  }else{
    setMsg("当前为离线打开（file://），数据为内置快照","");
  }
  buildTrains(); renderAll(); renderNote();
  if(CAN_API) loadStations();          // 起终点选择器的站名表（懒加载）
}
boot();
</script>
